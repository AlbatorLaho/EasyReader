name: Build

permissions:
  contents: write

on:
  push:
    tags: 
      - "v*.*.*"

env:
  BUILD_DIR: "build"
  EXPORT_OPTIONS_PLIST: "ExportOptions.plist"
  XCODE_PROJECT: "EasyReader.xcodeproj"
  XCODE_SCHEME: "EasyReader"
  XCODE_ARCHIVE: "EasyReader.xcarchive"
  DMG_NAME: "EasyReader"
  DMG_FILE_NAME: "EasyReader-${{ github.ref_name }}.dmg"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: xcodebuild archive -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -archivePath "$XCODE_ARCHIVE" -configuration Release ONLY_ACTIVE_ARCH=NO | xcpretty && exit ${PIPESTATUS[0]}

      - name: Export
        run: |
          plutil -convert xml1 - -o "$EXPORT_OPTIONS_PLIST" << EOF
            {
              "destination": "export",
              "method": "mac-application"
            }
          EOF

          xcodebuild -exportArchive -archivePath "$XCODE_ARCHIVE" -exportPath "$BUILD_DIR" -exportOptionsPlist "$EXPORT_OPTIONS_PLIST"

      - name: Make DMG
        run: hdiutil create -srcdir "$BUILD_DIR" -volname "$DMG_NAME" "$DMG_FILE_NAME"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_FILE_NAME }}
