name: Build

permissions:
  contents: write

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # history + tags for release-notes.sh

      - name: Build
        run: scripts/build-release.sh "$GITHUB_REF_NAME"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "build/EasyReader-$GITHUB_REF_NAME.dmg" --verify-tag --notes-file "$RUNNER_TEMP/notes.md"
